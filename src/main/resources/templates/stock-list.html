<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Stock Market</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 20px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            background: #007bff;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            transition: transform 0.2s, background 0.2s;
        }

        li:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

        a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            display: block;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 15px;
            background: #28a745;
            color: white;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, transform 0.2s;
        }

        .back-link:hover {
            background: #218838;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Investing</h2>
    <ul>
        <li th:each="stock : ${stocks}">
            <a th:href="@{/transaction/new(stockId=${stock.id}, userId=${userId})}">
                <strong th:text="${stock.ticker}"></strong> -
                <span th:text="${stock.companyName}"></span>
                ($<span th:text="${stock.currentPrice}"></span>)
            </a>
        </li>
    </ul>

    <a th:href="@{/}" class="back-link">Back to Home Page</a>
</div>

</body>
</html>

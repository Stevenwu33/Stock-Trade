
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f8f9fa;
        }

        h2, h3 {
            color: #333;
        }

        div {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        p {
            margin: 8px 0;
        }

        input {
            padding: 8px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<h2>User Profile</h2>
<!--  //Binding is in the AppUserController -->
<div>
    <h3><span th:text="${user.name}"></span></h3>
    <p>@<span th:text="${user.username}"></span></p>
    <p><span th:text="${user.email}"></span></p>
    <a><span style="text-decoration: underline; font-size: small" >Edit Profile</span></a>
<!--    <span style="font-size: 12px; color: blue; text-decoration: underline;" >Edit Profile</span>-->

    <!-- Edit Button  (disabled)-->
<!--    <form th:action="@{/profile/{userId}/update-email(userId=${user.id})}" method="post">-->
<!--        <label for="email">Email:</label>-->
<!--        <input type="email" id="email" name="email" th:value="${user.email}" required>-->
<!--        <button type="submit">Update</button>-->
<!--    </form>-->


</div>
<!-- //Binding is in the AppUserController -->
<h3>Bank Transfer</h3>
<div>
    <h4>Cash Available</h4>
    <p> $<span th:text="${wallet.balance}"></span></p>
    <br>
    <button>Withdrawal</button>
    <button>Deposit</button>
</div>
<!-- //Binding is in the transaction Controller-->
<h3>Transaction History</h3>
<div>
    <ul>
        <li th:each="transaction : ${transactions}">
            <p>
                Stock: <span th:text="${transaction.stock.ticker}"></span> |
                Quantity: <span th:text="${transaction.quantity}"></span> |
                Price: $<span th:text="${transaction.priceAtTransaction}"></span> |
                Date: <span th:text="${transaction.transactionDate}"></span>
                <!-- Delete button -->
            <form th:action="@{/transaction/delete}" method="post" style="display:inline;">
                <input type="hidden" name="transactionId" th:value="${transaction.id}">
                <input type="hidden" name="userId" th:value="${user.id}">
                <button type="submit">Delete</button>
            </form>
            </p>
        </li>
    </ul>
</div>

<a th:href="@{/}">Back to Home</a>
</body>
</html>

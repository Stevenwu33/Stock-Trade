<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Profile</title>
</head>
<body>
<h2>User Profile</h2>

<div>
    <h3>Account Information</h3>
    <p>Name: <span th:text="${user.username}"></span></p>
    <p>Email: <span th:text="${user.email}"></span></p>
    <p>Wallet Balance: $<span th:text="${wallet.balance}"></span></p>
</div>

<h3>Transaction History</h3>
<div>
    <ul>
        <li th:each="transaction : ${transactions}">
            <p>
                Stock: <span th:text="${transaction.stock.ticker}"></span> |
                Quantity: <span th:text="${transaction.quantity}"></span> |
                Price: $<span th:text="${transaction.priceAtTransaction}"></span> |
                Date: <span th:text="${transaction.transactionDate}"></span>
            </p>
        </li>
    </ul>
</div>

<a th:href="@{/}">Back to Home</a>
</body>
</html>

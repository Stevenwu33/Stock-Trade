<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout</title>
</head>
<body>
<h2>Checkout</h2>

<!-- Ensure transactions exist -->
<div th:if="${transactions}">
    <table>
        <tr>
            <th>Stock</th>
            <th>Current Price</th>
            <th>Quantity</th>
            <th>Actions</th>
        </tr>
        <tr th:each="transaction : ${transactions}">
            <td>
                <strong th:text="${transaction.stock.ticker}"></strong> -
                <span th:text="${transaction.stock.companyName}"></span>
            </td>
            <td>$<span th:text="${transaction.stock.currentPrice}"></span></td>
            <td><span th:text="${transaction.quantity}"></span></td>
            <td>
                <!-- Update Quantity -->
                <form th:action="@{/transaction/update}" method="post">
                    <input type="hidden" name="transactionId" th:value="${transaction.id}">
                    <input type="hidden" name="userId" th:value="${userId}">
                    <input type="hidden" name="stockId" th:value="${stock.id}">
                    <label for="newQuantity">New Quantity</label>
                    <input type="number" id="newQuantity" name="newQuantity" min="1" value="${transaction.quantity}" required>
                    <button type="submit">Update</button>
                </form>

                <!-- Remove from Checkout -->
                <form th:action="@{/transaction/delete}" method="post">
                    <input type="hidden" name="transactionId" th:value="${transaction.id}">
                    <input type="hidden" name="userId" th:value="${userId}">
                    <button type="submit">Remove</button>
                </form>
            </td>
        </tr>
    </table>

    <!-- Total Cost -->
    <p><strong>Total Cost:</strong> $<span th:text="${totalCost}"></span></p>

    <!-- Confirm Purchase -->
    <form th:action="@{/transaction/confirm}" method="post">
        <input type="hidden" name="stockId" th:value="${stock.id}">
        <input type="hidden" name="quantity" th:value="${quantity}">
        <input type="hidden" name="userId" th:value="${userId}">
        <button type="submit">Confirm Purchase</button>
    </form>
</div>

<!-- Show message if no transactions are present -->
<div th:if="${transactions == null or transactions.isEmpty()}">
    <p>No stocks selected for checkout.</p>
</div>

<a th:href="@{/stocks}">Back to Stocks</a>
</body>
</html>
